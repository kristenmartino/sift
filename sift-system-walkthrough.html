<!DOCTYPE html>
<title>Sift — one article, end to end</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* ════════════════════════════════════════════════════════════════
   TOKENS — inherited from sift-product-os.html, Sift's own identity.
   One accent carries meaning: vermillion = this step costs money.
   ════════════════════════════════════════════════════════════════ */
:root{
  --paper:#f7f3ec; --paper-2:#fffdf9; --paper-3:#f1ece2; --recess:#ede7db;
  --ink:#1e1b17; --ink-2:#5c554c; --ink-3:#8e8578;
  --rule:#ddd4c6; --rule-2:#eae3d7;
  --vermillion:#c8452a; --vermillion-wash:rgba(200,69,42,.09);
  --moss:#4a6b4f; --moss-wash:rgba(74,107,79,.10);
  --slate:#3f5568;
  --sh:0 1px 2px rgba(30,27,23,.05), 0 8px 24px -16px rgba(30,27,23,.28);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,ui-serif,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --col:66ch; --wide:1060px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#15130f; --paper-2:#1c1915; --paper-3:#221e18; --recess:#191510;
    --ink:#ece5d9; --ink-2:#a89f92; --ink-3:#7d7568;
    --rule:#3a342b; --rule-2:#2a251e;
    --vermillion:#e8735a; --vermillion-wash:rgba(232,115,90,.13);
    --moss:#8fb894; --moss-wash:rgba(143,184,148,.13);
    --slate:#8fabc4;
    --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#15130f; --paper-2:#1c1915; --paper-3:#221e18; --recess:#191510;
  --ink:#ece5d9; --ink-2:#a89f92; --ink-3:#7d7568;
  --rule:#3a342b; --rule-2:#2a251e;
  --vermillion:#e8735a; --vermillion-wash:rgba(232,115,90,.13);
  --moss:#8fb894; --moss-wash:rgba(143,184,148,.13);
  --slate:#8fabc4;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --paper:#f7f3ec; --paper-2:#fffdf9; --paper-3:#f1ece2; --recess:#ede7db;
  --ink:#1e1b17; --ink-2:#5c554c; --ink-3:#8e8578;
  --rule:#ddd4c6; --rule-2:#eae3d7;
  --vermillion:#c8452a; --vermillion-wash:rgba(200,69,42,.09);
  --moss:#4a6b4f; --moss-wash:rgba(74,107,79,.10);
  --slate:#3f5568;
  --sh:0 1px 2px rgba(30,27,23,.05), 0 8px 24px -16px rgba(30,27,23,.28);
}
*{box-sizing:border-box}
html{overflow-x:clip}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--serif); font-size:17px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--vermillion); outline-offset:2px; border-radius:2px}
::selection{background:var(--vermillion-wash)}

/* ═══ RAIL — the pipeline as a measured strip ═══ */
.rail{position:sticky; top:0; z-index:50; background:var(--paper); border-bottom:1px solid var(--rule)}
.rail-in{max-width:var(--wide); margin:0 auto; padding:12px clamp(16px,4vw,36px) 0;
  display:flex; flex-direction:column; gap:9px}
.rail-top{display:flex; align-items:center; gap:13px; flex-wrap:wrap}
.diamond{width:12px; height:12px; background:var(--vermillion); transform:rotate(45deg); flex:none}
.mark{font-family:var(--serif); font-size:20px; font-weight:600; letter-spacing:-.02em}
.mark-sub{font-family:var(--mono); font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3)}
.rail-tools{margin-left:auto; display:flex; gap:6px}
.btn{font-family:var(--mono); font-size:12px; color:var(--ink-2); background:var(--paper-2);
  border:1px solid var(--rule); border-radius:2px; padding:5px 11px; cursor:pointer; white-space:nowrap}
.btn:hover{color:var(--ink); border-color:var(--ink-3)}
.btn[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.btn-k{font-family:var(--mono); font-size:10px; opacity:.5; margin-left:5px}

.axis{padding-bottom:10px}
.acts,.ticks{display:grid; gap:2px}
.acts{margin-bottom:5px}
.act-span{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); border-top:1px solid var(--rule-2); padding:4px 10px 0 0; white-space:nowrap}
.act-span.on{color:var(--vermillion); border-top-color:var(--vermillion)}
.tick{position:relative; height:24px; padding:4px 0 0; cursor:pointer; background:none;
  border:0; border-top:2px solid var(--rule); font-family:var(--mono); font-size:11px;
  color:var(--ink-3); display:flex; align-items:flex-start; justify-content:center}
.tick:hover{color:var(--ink); border-top-color:var(--ink-3)}
.tick.seen{border-top-color:var(--ink-3); color:var(--ink-2)}
.tick.on{border-top-color:var(--vermillion); color:var(--vermillion); font-weight:700}
.tick.on::before{content:""; position:absolute; top:-5px; left:50%; transform:translateX(-50%);
  width:8px; height:8px; border-radius:50%; background:var(--vermillion);
  box-shadow:0 0 0 4px var(--vermillion-wash)}

/* ═══ STAGE ═══ */
.stage{max-width:var(--wide); margin:0 auto; padding:0 clamp(16px,4vw,36px) 90px}
.view[hidden]{display:none}
.step{padding-top:42px}
@media (prefers-reduced-motion:no-preference){
  .step.anim{animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
}
.head{display:grid; grid-template-columns:74px minmax(0,1fr); gap:0 20px; align-items:start}
.num{font-family:var(--mono); font-size:40px; font-weight:500; line-height:.85;
  letter-spacing:-.04em; color:var(--rule); font-variant-numeric:tabular-nums}
.step.paid .num{color:var(--vermillion)}
.eyebrow{font-family:var(--mono); font-size:11.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-3); margin:0 0 7px}
h2.title{font-family:var(--serif); font-size:clamp(25px,3.4vw,34px); font-weight:600;
  letter-spacing:-.022em; line-height:1.14; margin:0; text-wrap:balance}
.lede{grid-column:2; max-width:var(--col); margin:15px 0 0; font-size:19.5px; line-height:1.5;
  color:var(--ink-2); font-style:italic; text-wrap:pretty}
.body{grid-column:2; max-width:var(--col); margin-top:20px; font-family:var(--sans); font-size:15.5px; line-height:1.62}
/* Responsive overrides live at the end of this sheet — see RESPONSIVE. */
.body>p{margin:0 0 14px; text-wrap:pretty}
.body>p:last-child{margin-bottom:0}
.body h3{font-family:var(--mono); font-size:11.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-3); margin:26px 0 10px; padding-bottom:5px; border-bottom:1px solid var(--rule-2)}
.body ul{margin:0 0 14px; padding-left:0; list-style:none}
.body li{position:relative; padding-left:19px; margin-bottom:8px; text-wrap:pretty}
.body li::before{content:""; position:absolute; left:2px; top:.72em; width:7px; height:1.5px; background:var(--ink-3)}
code,.k{font-family:var(--mono); font-size:.9em; background:var(--recess);
  border:1px solid var(--rule-2); border-radius:2px; padding:1px 4.5px; word-break:break-word}
.pull{margin:20px 0; padding:13px 0 13px 17px; border-left:2px solid var(--vermillion);
  font-family:var(--serif); font-size:17px; font-style:italic; line-height:1.5; color:var(--ink)}
.pull .src{display:block; margin-top:8px; font-family:var(--mono); font-size:10.5px; font-style:normal;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}

/* ═══ THE SPINE — one article, tracked ═══ */
.spine{grid-column:2; max-width:none; margin:26px 0 0}
.spine-in{background:var(--paper-2); border:1px solid var(--rule); border-left:3px solid var(--moss);
  border-radius:3px; padding:15px 18px 13px; box-shadow:var(--sh)}
.spine-h{font-family:var(--mono); font-size:11px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--moss); margin-bottom:11px; display:flex; gap:9px; align-items:baseline; flex-wrap:wrap}
.spine-h em{font-style:normal; color:var(--ink-3); letter-spacing:.04em}
.spine dl{margin:0; display:grid; grid-template-columns:132px minmax(0,1fr); gap:7px 14px}
.spine dt{font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--ink-3); padding-top:2px}
.spine dd{margin:0; font-family:var(--mono); font-size:12.5px; line-height:1.55; color:var(--ink-2); overflow-wrap:anywhere}
.spine dd .v{color:var(--ink)}
.spine dd .null{color:var(--ink-3); font-style:italic}
.spine dd .new{color:var(--moss)}
.spine-note{margin:11px 0 0; padding-top:9px; border-top:1px solid var(--rule-2);
  font-family:var(--sans); font-size:12.5px; line-height:1.5; color:var(--ink-2)}
@media(max-width:560px){.spine dl{grid-template-columns:1fr; gap:2px 0} .spine dt{margin-top:8px}}

/* ═══ FIGURES ═══ */
.fig{grid-column:2; max-width:none; margin:26px 0 0}
.fig-in{background:var(--paper-2); border:1px solid var(--rule); border-radius:3px;
  padding:16px 18px 13px; box-shadow:var(--sh)}
.fig-t{font-family:var(--mono); font-size:13px; font-weight:700; margin:0 0 3px}
.fig-s{font-family:var(--sans); font-size:12.5px; line-height:1.45; color:var(--ink-3); margin:0 0 13px; max-width:62ch}
.fig-scroll{overflow-x:auto}
.fig-note{font-family:var(--sans); font-size:12.5px; color:var(--ink-2); margin:11px 0 0;
  padding-top:9px; border-top:1px solid var(--rule-2); line-height:1.45}
table.data{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:12.5px;
  font-variant-numeric:tabular-nums; min-width:420px}
table.data th{text-align:right; font-weight:500; color:var(--ink-3); font-size:10.5px;
  letter-spacing:.08em; text-transform:uppercase; padding:0 0 6px 15px; border-bottom:1px solid var(--ink)}
table.data th:first-child,table.data td:first-child{text-align:left; padding-left:0}
table.data td{text-align:right; padding:6px 0 6px 15px; border-bottom:1px solid var(--rule-2); color:var(--ink-2)}
table.data tr.hl td{color:var(--ink); background:var(--vermillion-wash)}
table.data tr.hl td:first-child{color:var(--vermillion)}
.up{color:var(--moss)}
.map-svg{display:block; width:100%; min-width:520px; height:auto}
.map-svg .bx{fill:var(--paper-2); stroke:var(--rule)}
.map-svg .lb{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; fill:var(--ink-3)}
.map-svg .tx{font-family:var(--sans); font-size:12px; fill:var(--ink)}
.map-svg .role{font-family:var(--sans); font-size:11px; font-style:italic; fill:var(--ink-3)}
.map-svg .ar{stroke:var(--ink-3); fill:none; stroke-width:1}
.map-svg .an{fill:var(--ink-3)}
.map-node{cursor:pointer}
.map-node:hover .bx{stroke:var(--vermillion); stroke-width:1.8}
.map-node:hover .tx{fill:var(--vermillion)}
.map-node:focus-visible{outline:none}
.map-node:focus-visible .bx{stroke:var(--vermillion); stroke-width:2.4}

/* framing table */
.framings{display:flex; flex-direction:column; gap:0}
.fr{display:grid; grid-template-columns:150px minmax(0,1fr); gap:14px; padding:9px 0;
  border-bottom:1px solid var(--rule-2); align-items:baseline}
.fr:last-child{border-bottom:0}
.fr-o{font-family:var(--mono); font-size:12px; color:var(--ink-3)}
.fr-t{font-family:var(--sans); font-size:14px; color:var(--ink-2); line-height:1.45}
.fr-t b{color:var(--vermillion); font-weight:600}
@media(max-width:560px){.fr{grid-template-columns:1fr; gap:2px}}

/* gate demo */
.gl{width:100%; text-align:left; display:block; background:var(--paper-2); border:1px solid var(--rule);
  border-left:2px solid var(--ink-3); padding:11px 13px; margin-bottom:8px; cursor:pointer;
  font:inherit; color:inherit; border-radius:2px}
.gl:hover{border-color:var(--ink-3); border-left-color:var(--vermillion)}
.gl[aria-expanded="true"]{border-left-color:var(--vermillion)}
.gl-t{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); margin-bottom:5px}
.gl-l{font-family:var(--serif); font-size:15.5px; font-style:italic; line-height:1.4}
.gl[aria-expanded="true"] .gl-l{text-decoration:line-through; text-decoration-color:var(--vermillion); color:var(--ink-2)}
.gl-x{display:none; margin-top:10px; padding-top:9px; border-top:1px dashed var(--rule);
  font-family:var(--sans); font-size:13.5px; color:var(--ink-2)}
.gl[aria-expanded="true"] .gl-x{display:block}
.gl-x code{color:var(--vermillion)}

/* timeline */
.tl-ctl{display:flex; gap:7px; align-items:center; margin-bottom:13px; flex-wrap:wrap}
.tl-ctl button{font-family:var(--mono); font-size:11.5px; padding:6px 10px; border:1px solid var(--rule);
  background:var(--paper-2); color:var(--ink-2); cursor:pointer; border-radius:2px}
.tl-ctl button[aria-pressed="true"]{background:var(--vermillion); color:var(--paper); border-color:var(--vermillion)}
.tl-when{font-family:var(--sans); font-size:12.5px; color:var(--ink-2)}
td.nullv{color:var(--ink-3); font-style:italic}
td.fill{background:var(--moss-wash); color:var(--ink)}

/* ═══ DRAWERS ═══ */
.drawers{grid-column:2; max-width:none; margin-top:28px; display:flex; flex-direction:column; gap:9px}
details.d{border:1px solid var(--rule); background:var(--paper-2); border-radius:3px; overflow:hidden}
details.d>summary{list-style:none; cursor:pointer; padding:11px 15px; display:flex; align-items:center;
  gap:10px; font-family:var(--mono); font-size:13px; font-weight:700}
details.d>summary::-webkit-details-marker{display:none}
details.d>summary::after{content:"OPEN"; margin-left:auto; font-size:9px; letter-spacing:.1em;
  color:var(--ink-3); font-weight:400; flex:none}
details.d[open]>summary::after{content:"CLOSE"}
.d-tag{font-family:var(--mono); font-size:10px; letter-spacing:.11em; padding:2.5px 6px; border-radius:2px; flex:none}
.d-body{padding:0 15px 15px}
.d-body>*:first-child{margin-top:0}
details.war{border-left:3px solid var(--vermillion)}
details.war>summary{color:var(--vermillion)}
details.war .d-tag{background:var(--vermillion-wash); color:var(--vermillion)}
.war .d-body{font-family:var(--sans); font-size:15px; line-height:1.58; color:var(--ink-2)}
.war .d-body p{margin:0 0 12px; text-wrap:pretty}
.war .d-body p:last-child{margin-bottom:0}
.fixline{margin-top:13px; padding:10px 12px; background:var(--recess); border-radius:2px;
  border-left:2px solid var(--moss); font-family:var(--mono); font-size:12.5px; line-height:1.5; color:var(--ink)}
.fixline b{color:var(--moss); display:block; font-size:10.5px; letter-spacing:.11em; margin-bottom:4px}
details.hood{border-left:3px solid var(--ink-3); background:var(--recess)}
details.hood .d-tag{background:var(--rule-2); color:var(--ink-2)}
.hood dl{margin:0; display:grid; grid-template-columns:96px minmax(0,1fr); gap:7px 14px}
.hood dt{font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--ink-3); padding-top:2px}
.hood dd{margin:0; font-family:var(--mono); font-size:12.5px; line-height:1.6; color:var(--ink-2); overflow-wrap:anywhere}
.hood dd .p{color:var(--ink)}
.hood dd span.c{display:inline-block; margin-right:12px; max-width:100%}
@media(max-width:560px){.hood dl{grid-template-columns:1fr; gap:3px 0} .hood dt{margin-top:8px}}

/* ═══ FOOT NAV ═══ */
.foot{grid-column:1/-1; margin-top:40px; padding-top:17px; border-top:1px solid var(--rule);
  display:flex; align-items:center; gap:12px}
.nav-b{font-family:var(--mono); font-size:12.5px; font-weight:700; background:var(--paper-2);
  border:1px solid var(--rule); color:var(--ink); border-radius:2px; padding:9px 15px; cursor:pointer;
  display:flex; flex-direction:column; gap:2px; min-width:0; text-align:left}
.nav-b:hover:not(:disabled){border-color:var(--vermillion); background:var(--vermillion-wash)}
.nav-b:disabled{opacity:.3; cursor:default}
.nav-b small{font-family:var(--mono); font-size:10px; letter-spacing:.11em; color:var(--ink-3);
  font-weight:400; text-transform:uppercase}
.nav-b .t{white-space:normal; max-width:30ch; line-height:1.3}
.nav-b.next{margin-left:auto; text-align:right}
.nav-count{font-family:var(--mono); font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums; flex:none}
@media(max-width:560px){.nav-b .t{max-width:16ch; font-size:11.5px}}

/* ═══ MAP VIEW ═══ */
.map-head{padding-top:42px; max-width:var(--col)}
.map-head h2{font-family:var(--serif); font-size:clamp(23px,3vw,30px); font-weight:600;
  letter-spacing:-.02em; margin:8px 0 12px}
.map-head p{margin:0; color:var(--ink-2); font-size:17px}
.ledger{margin-top:42px}
.ledger-h{font-family:var(--mono); font-size:11.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-3); padding-bottom:7px; border-bottom:1px solid var(--rule); margin-bottom:4px}
.inc{width:100%; text-align:left; background:none; border:0; cursor:pointer; display:grid;
  grid-template-columns:minmax(0,1fr) auto; gap:14px; align-items:baseline; padding:12px 8px;
  border-bottom:1px solid var(--rule-2); border-radius:2px}
.inc:hover{background:var(--vermillion-wash)}
.inc-t{display:block; font-family:var(--mono); font-size:13.5px; font-weight:700; color:var(--vermillion)}
.inc-d{display:block; font-family:var(--sans); font-size:13px; color:var(--ink-2); margin-top:4px; line-height:1.45}
.inc-go{font-family:var(--mono); font-size:11px; color:var(--ink-3); flex:none}
@media(max-width:560px){.inc{grid-template-columns:1fr} .inc-go{display:none}}
.colophon{margin-top:52px; padding-top:20px; border-top:1px solid var(--rule);
  font-family:var(--mono); font-size:12.5px; color:var(--ink-3); line-height:1.75; max-width:76ch}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
/* ════════════════════════════════════════════════════════════════
   RESPONSIVE — deliberately last in the sheet.
   .spine/.fig/.drawers each set grid-column:2 in their own rules; at equal
   specificity the later declaration wins, so an earlier media query was being
   silently overridden and the head grid kept an implicit second column.
   ════════════════════════════════════════════════════════════════ */
@media(max-width:760px){
  .head{grid-template-columns:minmax(0,1fr); gap:5px}
  .num{font-size:28px}
  .lede,.body,.fig,.drawers,.spine,.foot{grid-column:1}
  .body,.lede{max-width:none}
}
@media(max-width:620px){
  /* Six act labels cannot fit a phone-width axis without truncating. Drop the
     row rather than clip it — every step's eyebrow already names its act. */
  .acts{display:none}
  .axis{padding-bottom:8px}
}
@media(max-width:560px){
  .spine dl,.hood dl{grid-template-columns:minmax(0,1fr); gap:3px 0}
  .spine dt,.hood dt{margin-top:9px}
  .fr{grid-template-columns:minmax(0,1fr); gap:2px}
  .inc{grid-template-columns:minmax(0,1fr)}
  .inc-go{display:none}
  .nav-b .t{max-width:16ch; font-size:11.5px}
  .foot{gap:8px}
}
</style>

<header class="rail">
  <div class="rail-in">
    <div class="rail-top">
      <span class="diamond" aria-hidden="true"></span>
      <div>
        <div class="mark">Sift</div>
        <div class="mark-sub">One article, end to end</div>
      </div>
      <div class="rail-tools">
        <button class="btn" id="btn-steps" aria-pressed="true" type="button">Walkthrough</button>
        <button class="btn" id="btn-map" aria-pressed="false" type="button">Map<span class="btn-k">M</span></button>
      </div>
    </div>
    <div class="axis" id="axis">
      <div class="acts" id="acts"></div>
      <div class="ticks" id="ticks"></div>
    </div>
  </div>
</header>

<main class="stage">
  <div class="view" id="view-steps"><div id="step-host"></div></div>
  <div class="view" id="view-map" hidden></div>
</main>

<script>
(function(){
"use strict";

/* ════════════════════════════════════════════════════════════════
   THE SPINE
   One real article, carried through every step. Source: the labeled
   clustering corpus in sift-api/data/eval/clustering_corpus.jsonl —
   real outlet, real title, real Haiku-written summary, real extracted
   entities. Three sibling articles cover the same event, which is what

    "<p>Our four articles clustered correctly. I know that because a human labeled them in the corpus, not because Sift measured it.</p>" +
    '<div class="pull">Until then, event-clustering accuracy is <b>unmeasured</b> and should not be quoted.<span class="src">sift-api/STATUS.md</span></div>' +
    "<p>That line is in the repo&rsquo;s own status document, written to stop a future version of its author from citing a number that does not exist. It is the most load-bearing sentence in the project: a system that gates its own output on evidence has to hold its own claims to the same gate.</p>",
  fig: function(){
    return fig({
      t:"Measured, and not",
      body:'<table class="data"><thead><tr><th>Measured</th><th>Not measured</th></tr></thead><tbody>' +
        "<tr><td>why_it_matters quality &mdash; 500 articles, judged</td><td>event-clustering accuracy</td></tr>" +
        "<tr><td>feed health &mdash; daily, per outlet</td><td>entity-linking precision and recall</td></tr>" +
        "<tr><td>spend &mdash; per day, model and operation</td><td>summary faithfulness against source text</td></tr>" +
        "<tr><td>search funnel &middot; primer expansions</td><td>whether readers open the primer twice</td></tr>" +
        "</tbody></table>",
      note:"The clustering corpus exists and is partly labeled; it needs roughly 3–4 hours of hand review before the first real accuracy number can be produced."
    });
  },
  hood:[["sources","<span class='p'>sift-api/STATUS.md</span> &middot; sift/docs/HOW_IT_WORKS.md &middot; sift/docs/DECISIONS.md (D1&ndash;D46)"],
        ["stale, do not cite","sift/docs/ARCHITECTURE.md &mdash; claims 1024 dims (actually 512), &ldquo;100+ feeds&rdquo; (actually 59), and a 5-node pipeline"],
        ["corpora","data/eval/clustering_corpus.jsonl &mdash; labeled batches, awaiting hand review"]]
}
];

/* incidents surfaced on the map view */
var INCIDENTS = [
  { s:2,  t:"Fifteen silent days", d:"A feed returned HTTP 400 for two weeks and the run kept reporting success." },
  { s:4,  t:"The model apologized on a live card", d:"Empty RSS bodies produced polite refusals that were written to the summary column." },
  { s:8,  t:"Cloud, Banks and Hill", d:"Surname matching turned weather stories into civic dossier links." },
  { s:11, t:"Zero stories, reported as success", d:"A fixed token limit truncated the clustering array mid-response." },
  { s:12, t:"Articles carrying other articles' summaries", d:"A batch response was trusted to line up with its input instead of made to prove it." },
  { s:14, t:"Off by twenty times", d:"Believed spend was ~$15/month. Actual was ~$10/day. Nothing was broken; nothing was measured." }
];

/* ════════════════════════════════════════════════════════════════
   RENDER
   ════════════════════════════════════════════════════════════════ */
var host = document.getElementById("step-host"),
    ticksEl = document.getElementById("ticks"),
    actsEl = document.getElementById("acts"),
    viewSteps = document.getElementById("view-steps"),
    viewMap = document.getElementById("view-map"),
    btnSteps = document.getElementById("btn-steps"),
    btnMap = document.getElementById("btn-map");
var cur = 0, seen = {}, mode = "steps";

/* group consecutive steps by act for the axis */
var ACT_SHORT = { "What lands later":"Deferred", "When a reader arrives":"The reader" };
function actRuns(){
  var runs = [], last = null;
  STEPS.forEach(function(s, i){
    if (!last || last.name !== s.act){ last = { name:s.act, from:i, to:i }; runs.push(last); }
    else last.to = i;
  });
  return runs;
}
function buildAxis(){
  var runs = actRuns();
  actsEl.style.gridTemplateColumns = runs.map(function(r){ return (r.to - r.from + 1) + "fr"; }).join(" ");
  actsEl.innerHTML = runs.map(function(r){
    return '<div class="act-span" data-from="' + r.from + '" data-to="' + r.to + '">' + (ACT_SHORT[r.name] || r.name) + "</div>";
  }).join("");
  ticksEl.style.gridTemplateColumns = "repeat(" + STEPS.length + ", 1fr)";
  ticksEl.innerHTML = STEPS.map(function(s, i){
    var label = s.num || "\u00b7";
    return '<button class="tick" type="button" data-i="' + i + '" aria-label="' +
      (s.act + ": " + s.title).replace(/<[^>]+>/g, "").replace(/"/g, "") + '">' + label + "</button>";
  }).join("");
}
function paintAxis(){
  Array.prototype.forEach.call(ticksEl.children, function(b, i){
    b.classList.toggle("on", i === cur);
    b.classList.toggle("seen", i !== cur && !!seen[i]);
  });
  Array.prototype.forEach.call(actsEl.children, function(a){
    var f = +a.getAttribute("data-from"), t = +a.getAttribute("data-to");
    a.classList.toggle("on", cur >= f && cur <= t);
  });
}
function drawer(kind, tag, title, inner){
  return '<details class="d ' + kind + '"><summary><span class="d-tag">' + tag + "</span>" + title +
    '</summary><div class="d-body">' + inner + "</div></details>";
}
function render(i, animate){
  cur = Math.max(0, Math.min(STEPS.length - 1, i));
  seen[cur] = true;
  var s = STEPS[cur];
  var h = '<article class="step' + (animate ? " anim" : "") + (s.paid ? " paid" : "") + '">' +
    '<div class="head">' +
      '<div class="num">' + (s.num || "") + "</div>" +
      "<div>" +
        '<p class="eyebrow">' + s.act + "</p>" +
        '<h2 class="title">' + s.title + "</h2>" +
      "</div>" +
      '<p class="lede">' + s.lede + "</p>" +
      '<div class="body">' + s.body + "</div>" +
      (s.fig ? s.fig() : "") +
      (s.fig2 ? s.fig2() : "") +
      (s.spine ? s.spine() : "");

  var dr = "";
  if (s.war) dr += drawer("war", "WHAT WENT WRONG", s.war.t,
    s.war.body + (s.war.fix ? '<div class="fixline"><b>The fix</b>' + s.war.fix + "</div>" : ""));
  if (s.hood) dr += drawer("hood", "UNDER THE HOOD", "Files, models and constants",
    "<dl>" + s.hood.map(function(r){ return "<dt>" + r[0] + "</dt><dd>" + r[1] + "</dd>"; }).join("") + "</dl>");
  if (dr) h += '<div class="drawers">' + dr + "</div>";

  var prev = STEPS[cur - 1], next = STEPS[cur + 1];
  h += '<div class="foot">' +
    '<button class="nav-b prev" type="button"' + (prev ? "" : " disabled") + "><small>Previous</small>" +
      '<span class="t">' + (prev ? prev.title : "&mdash;") + "</span></button>" +
    '<span class="nav-count">' + (cur + 1) + " / " + STEPS.length + "</span>" +
    '<button class="nav-b next" type="button"' + (next ? "" : " disabled") + "><small>Next</small>" +
      '<span class="t">' + (next ? next.title : "&mdash;") + "</span></button>" +
    "</div>";

  h += "</div></article>";
  host.innerHTML = h;

  var p = host.querySelector(".prev"), n = host.querySelector(".next");
  if (p) p.addEventListener("click", function(){ go(cur - 1); });
  if (n) n.addEventListener("click", function(){ go(cur + 1); });
  wireStepWidgets();
  paintAxis();
}
function go(i){
  if (i < 0 || i >= STEPS.length) return;
  render(i, true);
  window.scrollTo(0, 0);
}

/* per-step interactive bits */
function wireStepWidgets(){
  // gate lines
  Array.prototype.forEach.call(host.querySelectorAll(".gl"), function(b){
    b.addEventListener("click", function(){
      b.setAttribute("aria-expanded", b.getAttribute("aria-expanded") === "true" ? "false" : "true");
    });
  });
  // deferred-lane timeline
  var tlb = host.querySelectorAll(".tlb");
  if (tlb.length){
    var cells = host.querySelectorAll("td[data-fill]"),
        when = host.querySelector("#tl-when"),
        copy = [
          "The store node has just committed. Four columns are empty and the card is already servable.",
          "The poller wakes. The batches are still processing, so nothing changes yet.",
          "Batches ended. The poller patches each row in place \u2014 gates applied, misaligned sub-batches skipped."
        ];
    Array.prototype.forEach.call(tlb, function(btn){
      btn.addEventListener("click", function(){
        var at = +btn.getAttribute("data-step");
        Array.prototype.forEach.call(tlb, function(b2){ b2.setAttribute("aria-pressed", String(b2 === btn)); });
        if (when) when.textContent = copy[at];
        Array.prototype.forEach.call(cells, function(td){
          var on = at >= +td.getAttribute("data-at");
          td.innerHTML = on ? td.getAttribute("data-fill") : "NULL";
          td.classList.toggle("nullv", !on);
          td.classList.toggle("fill", on);
        });
      });
    });
  }
  // clickable map nodes inside a step
  wireMapNodes(host);
}
function wireMapNodes(root){
  Array.prototype.forEach.call(root.querySelectorAll(".map-node"), function(g){
    function jump(){
      var t = +g.getAttribute("data-step");
      if (!isNaN(t)){ setMode("steps"); go(t); }
    }
    g.addEventListener("click", jump);
    g.addEventListener("keydown", function(e){
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); jump(); }
    });
  });
}

/* map view */
function renderMap(){
  var h = '<div class="map-head">' +
    '<p class="eyebrow">Overview</p>' +
    "<h2>The whole system on one page</h2>" +
    "<p>Every box jumps to the step that covers it. Below, the failures that shaped the design &mdash; each one also a step.</p>" +
    "</div>" +
    '<div class="fig" style="grid-column:auto"><div class="fig-in"><div class="fig-scroll">' + mapSvg(true) + "</div></div></div>" +
    '<div class="ledger"><div class="ledger-h">What went wrong, and where it is covered</div>' +
    INCIDENTS.map(function(x){
      return '<button class="inc" type="button" data-i="' + x.s + '"><span><span class="inc-t">' + x.t +
        '</span><span class="inc-d">' + x.d + "</span></span><span class=\"inc-go\">GO &rarr;</span></button>";
    }).join("") +
    "</div>" +
    '<p class="colophon">Compiled from the sift, sift-api and sift-mcp repositories at their current state on disk. ' +
    "Every constant, model ID and metric was read out of the source rather than recalled; the followed article, its summary and its entities are real rows from the labeled clustering corpus. " +
    "Where a value is illustrative rather than measured, the figure says so.</p>";
  viewMap.innerHTML = h;
  wireMapNodes(viewMap);
  Array.prototype.forEach.call(viewMap.querySelectorAll(".inc"), function(b){
    b.addEventListener("click", function(){ setMode("steps"); go(+b.getAttribute("data-i")); });
  });
}
function setMode(m){
  mode = m;
  var isSteps = m === "steps";
  viewSteps.hidden = !isSteps;
  viewMap.hidden = isSteps;
  btnSteps.setAttribute("aria-pressed", String(isSteps));
  btnMap.setAttribute("aria-pressed", String(!isSteps));
  document.getElementById("axis").style.visibility = isSteps ? "visible" : "hidden";
  window.scrollTo(0, 0);
}

/* wire up */
buildAxis();
ticksEl.addEventListener("click", function(e){
  var b = e.target.closest(".tick");
  if (b) go(+b.getAttribute("data-i"));
});
btnSteps.addEventListener("click", function(){ setMode("steps"); });
btnMap.addEventListener("click", function(){ setMode("map"); });
document.addEventListener("keydown", function(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  if (e.key === "ArrowRight"){ if (mode === "steps") go(cur + 1); }
  else if (e.key === "ArrowLeft"){ if (mode === "steps") go(cur - 1); }
  else if (e.key === "m" || e.key === "M"){ setMode(mode === "steps" ? "map" : "steps"); }
});
renderMap();
render(0, false);
})();
</script>
