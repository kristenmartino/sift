version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # TypeScript majors are held back deliberately, not by neglect. TS 7 is the
    # native-compiler rewrite: the default `typescript` import became a
    # version-string stub and the compiler/AST API moved to
    # `typescript/unstable/ast/*`. One blocker is already cleared, one remains
    # and is not ours to fix:
    #
    #   1. ✅ DONE (#289) — `__tests__/meta.test.ts`, the guard that proves the
    #      suite can fail (#267), used to drive `ts.createSourceFile` /
    #      `ts.isCallExpression` / `ts.forEachChild` directly and broke outright
    #      under TS 7. Ported to `@typescript-eslint/typescript-estree`'s stable
    #      ESTree AST, which doesn't depend on TypeScript's own internal API
    #      shape.
    #   2. STILL BLOCKING — `@typescript-eslint` 8.60.0 peer-requires
    #      `typescript >=4.8.4 <6.1.0` across 13 packages, and `npm run lint` is
    #      a required check (#275). Nothing on our side unblocks this.
    #
    # Lift the ignore when typescript-eslint ships TS 7 support. See STATUS.md
    # 2026-08-17 and #194 (closed, declined).
    #
    # eslint is held back the same way, for a chain we don't control. eslint
    # 10 removes an API (`context.getFilename`) that `eslint-plugin-react`
    # 7.37.5 still calls, so linting any file throws:
    #
    #   TypeError: Error while loading rule 'react/display-name':
    #   contextOrFilename.getFilename is not a function
    #
    # eslint-plugin-react is not a direct dependency here -- it arrives
    # transitively, pinned by `eslint-config-next` 16.3.1, so there is nothing
    # in this repo to bump. (`@typescript-eslint` is NOT part of this block:
    # it peers `^8.57.0 || ^9.0.0 || ^10.0.0` and is fine on eslint 10.)
    #
    # Lift the ignore when eslint-config-next ships a version that pulls an
    # eslint-10-compatible eslint-plugin-react. See #284.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
